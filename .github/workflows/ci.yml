name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# ยกเลิก run เก่าของ branch เดียวกันเมื่อมี push ใหม่ ไม่ต้องรอคิวเปล่า ๆ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test:run

      - name: Build
        # ค่า env เป็นตัวอย่างเพื่อให้ build ผ่าน ไม่ใช่ความลับ
        # แอปอ่านค่าจริงตอน deploy ไม่ได้ฝังไว้ในขั้นตอนนี้
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_APP_ENV: ci
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
